<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cymor Movie Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14100d;
    --surface:#1f1811;
    --surface-raised:#2a2018;
    --accent:#e8a33d;
    --accent-deep:#c97b1f;
    --text:#f5efe6;
    --muted:#9c8f7c;
    --danger:#d9483d;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    padding-bottom:env(safe-area-inset-bottom);
  }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  img{display:block; max-width:100%;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Bebas Neue',sans-serif; letter-spacing:0.5px;}

  /* Sprocket strip — the recurring filmstrip motif used as section dividers & loader */
  .sprocket-strip{
    display:flex; gap:10px; align-items:center; justify-content:center;
    padding:14px 0; opacity:0.55;
  }
  .sprocket-strip span{
    width:7px; height:7px; border-radius:50%;
    border:1.5px solid var(--accent);
  }

  /* Top bar */
  header{
    position:sticky; top:0; z-index:40;
    background:linear-gradient(180deg, rgba(20,16,13,0.97) 0%, rgba(20,16,13,0.9) 80%, transparent 100%);
    backdrop-filter:blur(6px);
    padding:16px 18px 10px;
  }
  .topbar{display:flex; align-items:center; gap:14px;}
  .wordmark{
    font-family:'Bebas Neue',sans-serif;
    font-size:1.6rem;
    letter-spacing:1px;
    white-space:nowrap;
  }
  .wordmark span{color:var(--accent);}
  .search-wrap{
    flex:1;
    display:flex; align-items:center;
    background:var(--surface);
    border:1px solid rgba(245,239,230,0.08);
    border-radius:999px;
    padding:9px 16px;
    gap:8px;
  }
  .search-wrap input{
    flex:1; background:none; border:none; outline:none;
    color:var(--text); font-size:0.95rem; font-family:'Inter',sans-serif;
  }
  .search-wrap input::placeholder{color:var(--muted);}
  .search-icon{color:var(--muted); font-size:0.9rem;}

  main{padding-bottom:60px;}

  /* Hero banner - snap scroll */
  .hero-scroll{
    display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory;
    padding:18px 18px 4px; -webkit-overflow-scrolling:touch;
  }
  .hero-scroll::-webkit-scrollbar{display:none;}
  .hero-card{
    position:relative; flex:0 0 82%; scroll-snap-align:start;
    border-radius:var(--radius); overflow:hidden; aspect-ratio:2/3;
    background:var(--surface);
  }
  .hero-card img{width:100%; height:100%; object-fit:cover;}
  .hero-card .grad{
    position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 40%, rgba(20,16,13,0.95) 100%);
  }
  .hero-card .meta{
    position:absolute; left:16px; right:16px; bottom:16px;
  }
  .hero-card .badge{
    display:inline-block; background:var(--accent); color:#14100d;
    font-size:0.68rem; font-weight:700; padding:3px 9px; border-radius:5px;
    margin-bottom:8px; text-transform:uppercase; letter-spacing:0.5px;
  }
  .hero-card h2{
    font-family:'Bebas Neue',sans-serif; font-size:1.7rem; line-height:1;
  }

  /* Catalog sections */
  .section{margin-top:26px;}
  .section-head{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:0 18px; margin-bottom:12px;
  }
  .section-head h3{
    font-family:'Bebas Neue',sans-serif; font-size:1.25rem; letter-spacing:0.5px; color:var(--text);
  }
  .section-head .count{color:var(--muted); font-size:0.75rem;}
  .row-scroll{
    display:flex; gap:12px; overflow-x:auto; padding:0 18px 6px;
    -webkit-overflow-scrolling:touch;
  }
  .row-scroll::-webkit-scrollbar{display:none;}
  .poster-card{
    flex:0 0 118px; cursor:pointer;
  }
  .poster-card .thumb{
    position:relative; width:118px; height:172px; border-radius:10px; overflow:hidden;
    background:var(--surface);
  }
  .poster-card img{width:100%; height:100%; object-fit:cover;}
  .poster-card .rating{
    position:absolute; top:6px; right:6px;
    background:rgba(20,16,13,0.8); color:var(--accent);
    font-size:0.65rem; font-weight:700; padding:2px 6px; border-radius:5px;
    font-family:'JetBrains Mono',monospace;
  }
  .poster-card .title{
    margin-top:8px; font-size:0.8rem; font-weight:600; line-height:1.25;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }

  /* Detail sheet */
  .sheet-overlay{
    position:fixed; inset:0; background:rgba(10,8,6,0.7);
    display:none; align-items:flex-end; z-index:100;
  }
  .sheet-overlay.open{display:flex;}
  .sheet{
    background:var(--surface); width:100%; max-height:92vh; overflow-y:auto;
    border-radius:22px 22px 0 0; padding-bottom:30px;
    animation:slideUp 0.28s ease-out;
  }
  @keyframes slideUp{from{transform:translateY(100%);} to{transform:translateY(0);}}
  .sheet-handle{
    width:36px; height:4px; background:rgba(245,239,230,0.2); border-radius:2px;
    margin:12px auto;
  }
  .sheet-backdrop{width:100%; aspect-ratio:16/9; position:relative; background:var(--surface-raised);}
  .sheet-backdrop img{width:100%; height:100%; object-fit:cover;}
  .sheet-backdrop .grad{position:absolute; inset:0; background:linear-gradient(180deg, transparent 30%, var(--surface) 100%);}
  .sheet-close{
    position:absolute; top:14px; right:14px; width:34px; height:34px; border-radius:50%;
    background:rgba(20,16,13,0.7); display:flex; align-items:center; justify-content:center;
    font-size:1.1rem; z-index:2;
  }
  .sheet-body{padding:0 20px;}
  .sheet-body h2{font-family:'Bebas Neue',sans-serif; font-size:2rem; margin-bottom:6px;}
  .sheet-meta{
    display:flex; gap:10px; align-items:center; color:var(--muted);
    font-family:'JetBrains Mono',monospace; font-size:0.78rem; margin-bottom:14px; flex-wrap:wrap;
  }
  .sheet-meta .pill{
    border:1px solid rgba(245,239,230,0.15); padding:2px 8px; border-radius:5px;
  }
  .sheet-desc{color:var(--muted); font-size:0.9rem; line-height:1.55; margin-bottom:18px;}

  .ep-picker{
    display:none; gap:14px; margin-bottom:18px;
  }
  .ep-picker.show{display:flex;}
  .stepper{flex:1;}
  .stepper label{font-size:0.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; display:block; margin-bottom:6px;}
  .stepper .box{
    display:flex; align-items:center; background:var(--surface-raised); border-radius:10px; overflow:hidden;
  }
  .stepper button{padding:10px 14px; font-size:1.1rem; color:var(--accent);}
  .stepper input{
    flex:1; text-align:center; background:none; border:none; color:var(--text);
    font-family:'JetBrains Mono',monospace; font-size:0.95rem; width:40px;
  }

  .play-btn{
    width:100%; background:var(--accent); color:#14100d; font-weight:700;
    font-size:1rem; padding:15px; border-radius:12px; display:flex; align-items:center;
    justify-content:center; gap:8px; margin-bottom:10px;
  }
  .play-btn:active{background:var(--accent-deep);}
  .play-status{font-size:0.8rem; color:var(--muted); text-align:center; min-height:18px;}

  /* Player overlay */
  .player-overlay{
    position:fixed; inset:0; background:#000; display:none; z-index:200;
    flex-direction:column;
  }
  .player-overlay.open{display:flex;}
  .player-topbar{
    position:absolute; top:0; left:0; right:0; z-index:2;
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top));
    background:linear-gradient(180deg, rgba(0,0,0,0.7), transparent);
  }
  .player-close{
    width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.1);
    display:flex; align-items:center; justify-content:center; font-size:1.2rem; color:#fff;
  }
  .quality-pill{
    background:rgba(255,255,255,0.1); color:#fff; font-size:0.75rem; font-family:'JetBrains Mono',monospace;
    padding:6px 12px; border-radius:999px;
  }
  video{width:100%; height:100%; object-fit:contain; margin:auto;}

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--muted);
  }
  .empty-state .display{font-size:1.4rem; color:var(--text); margin-bottom:8px;}

  ::-webkit-scrollbar{width:0; height:0;}
</style>
</head>
<body>

<header>
  <div class="topbar">
    <div class="wordmark">CYMOR<span>·</span>HUB</div>
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input id="searchInput" type="text" placeholder="Search movies, series, anime…" autocomplete="off">
    </div>
  </div>
</header>

<main id="mainContent">
  <div class="sprocket-strip"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <div id="feed"></div>
</main>

<!-- Detail sheet -->
<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet" id="sheet">
    <div class="sheet-backdrop">
      <img id="sheetBackdrop" src="" alt="">
      <div class="grad"></div>
      <button class="sheet-close" id="sheetClose">✕</button>
    </div>
    <div class="sheet-body">
      <h2 id="sheetTitle"></h2>
      <div class="sheet-meta" id="sheetMeta"></div>
      <p class="sheet-desc" id="sheetDesc"></p>

      <div class="ep-picker" id="epPicker">
        <div class="stepper">
          <label>Season</label>
          <div class="box">
            <button data-step="se" data-dir="-1">−</button>
            <input id="seInput" type="number" value="1" min="1" inputmode="numeric">
            <button data-step="se" data-dir="1">+</button>
          </div>
        </div>
        <div class="stepper">
          <label>Episode</label>
          <div class="box">
            <button data-step="ep" data-dir="-1">−</button>
            <input id="epInput" type="number" value="1" min="1" inputmode="numeric">
            <button data-step="ep" data-dir="1">+</button>
          </div>
        </div>
      </div>

      <button class="play-btn" id="playBtn">▶ Play</button>
      <div class="play-status" id="playStatus"></div>
    </div>
  </div>
</div>

<!-- Player -->
<div class="player-overlay" id="playerOverlay">
  <div class="player-topbar">
    <button class="player-close" id="playerClose">✕</button>
    <span class="quality-pill" id="qualityPill"></span>
  </div>
  <video id="videoEl" controls playsinline autoplay></video>
</div>

<script>
/* ------------------------------------------------------------------
   Point this at your deployed MovieBox API Pro backend (no trailing slash)
------------------------------------------------------------------- */
const API_BASE = "https://itscymor-production.up.railway.app";

const feedEl = document.getElementById('feed');
const searchInput = document.getElementById('searchInput');

let currentSubject = null; // holds {subjectId, detailPath, subjectType}

/* ---------------- Home feed ---------------- */
async function loadHome(){
  feedEl.innerHTML = loaderHTML();
  try{
    const res = await fetch(`${API_BASE}/home`);
    const data = await res.json();
    renderSections(data.sections || []);
  }catch(e){
    feedEl.innerHTML = emptyState("Couldn't load the catalog", "Check your connection and try again.");
  }
}

function renderSections(sections){
  feedEl.innerHTML = "";
  sections.forEach(sec => {
    if(!sec.items || !sec.items.length) return;
    if(sec.section === "Banner"){
      feedEl.appendChild(renderHero(sec.items));
    } else {
      feedEl.appendChild(renderRow(sec.section, sec.items));
    }
  });
  if(!feedEl.children.length){
    feedEl.innerHTML = emptyState("Nothing here yet", "The catalog came back empty.");
  }
}

function renderHero(items){
  const wrap = document.createElement('div');
  wrap.className = 'hero-scroll';
  items.slice(0, 10).forEach(item => {
    if(!item.slug) return;
    const card = document.createElement('div');
    card.className = 'hero-card';
    card.innerHTML = `
      <img src="${item.poster_url || ''}" loading="lazy" alt="${escapeHtml(item.name)}">
      <div class="grad"></div>
      <div class="meta">
        ${item.badge ? `<span class="badge">${escapeHtml(item.badge)}</span>` : ''}
        <h2>${escapeHtml(item.name || '')}</h2>
      </div>`;
    card.addEventListener('click', () => openDetail(item.slug));
    wrap.appendChild(card);
  });
  return wrap;
}

function renderRow(title, items){
  const section = document.createElement('div');
  section.className = 'section';
  section.innerHTML = `
    <div class="section-head"><h3>${escapeHtml(title)}</h3><span class="count">${items.length}</span></div>`;
  const row = document.createElement('div');
  row.className = 'row-scroll';
  items.forEach(item => {
    if(!item.slug) return;
    const card = document.createElement('div');
    card.className = 'poster-card';
    card.innerHTML = `
      <div class="thumb">
        <img src="${item.poster_url || ''}" loading="lazy" alt="${escapeHtml(item.name)}">
        ${item.rating ? `<span class="rating">★ ${item.rating}</span>` : ''}
      </div>
      <div class="title">${escapeHtml(item.name || '')}</div>`;
    card.addEventListener('click', () => openDetail(item.slug));
    row.appendChild(card);
  });
  section.appendChild(row);
  return section;
}

/* ---------------- Search ---------------- */
let searchTimer = null;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = searchInput.value.trim();
  if(!q){ loadHome(); return; }
  searchTimer = setTimeout(() => runSearch(q), 400);
});

async function runSearch(q){
  feedEl.innerHTML = loaderHTML();
  try{
    const res = await fetch(`${API_BASE}/search?q=${encodeURIComponent(q)}`);
    const data = await res.json();
    if(!data.items || !data.items.length){
      feedEl.innerHTML = emptyState("No matches", `Nothing found for "${escapeHtml(q)}".`);
      return;
    }
    feedEl.innerHTML = "";
    feedEl.appendChild(renderRow(`Results for "${q}"`, data.items));
  }catch(e){
    feedEl.innerHTML = emptyState("Search failed", "Try again in a moment.");
  }
}

/* ---------------- Detail sheet ---------------- */
const sheetOverlay = document.getElementById('sheetOverlay');
const sheetBackdrop = document.getElementById('sheetBackdrop');
const sheetTitle = document.getElementById('sheetTitle');
const sheetMeta = document.getElementById('sheetMeta');
const sheetDesc = document.getElementById('sheetDesc');
const epPicker = document.getElementById('epPicker');
const seInput = document.getElementById('seInput');
const epInput = document.getElementById('epInput');
const playStatus = document.getElementById('playStatus');

document.getElementById('sheetClose').addEventListener('click', () => sheetOverlay.classList.remove('open'));
sheetOverlay.addEventListener('click', (e) => { if(e.target === sheetOverlay) sheetOverlay.classList.remove('open'); });

document.querySelectorAll('.stepper button').forEach(btn => {
  btn.addEventListener('click', () => {
    const target = btn.dataset.step === 'se' ? seInput : epInput;
    const dir = parseInt(btn.dataset.dir, 10);
    const next = Math.max(1, (parseInt(target.value, 10) || 1) + dir);
    target.value = next;
  });
});

async function openDetail(slug){
  sheetOverlay.classList.add('open');
  sheetTitle.textContent = "Loading…";
  sheetMeta.innerHTML = "";
  sheetDesc.textContent = "";
  sheetBackdrop.src = "";
  epPicker.classList.remove('show');
  playStatus.textContent = "";
  seInput.value = 1; epInput.value = 1;

  try{
    const res = await fetch(`${API_BASE}/detail/${encodeURIComponent(slug)}`);
    const payload = await res.json();
    const subj = payload.data?.subject || payload.data || payload;

    currentSubject = {
      subjectId: subj.subjectId,
      detailPath: subj.detailPath || slug,
      subjectType: subj.subjectType
    };

    sheetTitle.textContent = subj.title || "Untitled";
    sheetBackdrop.src = subj.cover?.url || subj.stills?.url || "";
    sheetDesc.textContent = subj.description || "No synopsis available.";

    const metaBits = [];
    if(subj.releaseDate) metaBits.push(`<span class="pill">${subj.releaseDate.slice(0,4)}</span>`);
    if(subj.imdbRatingValue) metaBits.push(`<span class="pill">★ ${subj.imdbRatingValue}</span>`);
    if(subj.genre) metaBits.push(`<span class="pill">${escapeHtml(subj.genre)}</span>`);
    if(subj.countryName) metaBits.push(`<span class="pill">${escapeHtml(subj.countryName)}</span>`);
    sheetMeta.innerHTML = metaBits.join('');

    // subjectType 2 = TV series in this API's data — show season/episode steppers
    if(subj.subjectType === 2){
      epPicker.classList.add('show');
    }
  }catch(e){
    sheetTitle.textContent = "Couldn't load details";
    sheetDesc.textContent = "Try again in a moment.";
  }
}

/* ---------------- Player ---------------- */
const playerOverlay = document.getElementById('playerOverlay');
const videoEl = document.getElementById('videoEl');
const qualityPill = document.getElementById('qualityPill');

document.getElementById('playBtn').addEventListener('click', playCurrent);
document.getElementById('playerClose').addEventListener('click', () => {
  videoEl.pause();
  videoEl.removeAttribute('src');
  videoEl.querySelectorAll('track').forEach(t => t.remove());
  videoEl.load();
  playerOverlay.classList.remove('open');
});

async function playCurrent(){
  if(!currentSubject?.subjectId){ playStatus.textContent = "Missing subject info."; return; }
  const se = seInput.value || 1;
  const ep = epInput.value || 1;
  playStatus.textContent = "Resolving stream…";

  try{
    const streamRes = await fetch(
      `${API_BASE}/api/stream/${currentSubject.subjectId}?detail_path=${encodeURIComponent(currentSubject.detailPath)}&se=${se}&ep=${ep}`
    );
    const streamData = await streamRes.json();

    if(!streamData.has_resource){
      playStatus.textContent = streamData.note || "No stream found for this episode.";
      return;
    }

    // Pick the highest-resolution MP4 that actually has a URL
    const playable = (streamData.sources || [])
      .filter(s => s.url)
      .sort((a, b) => parseInt(b.resolution) - parseInt(a.resolution));

    if(!playable.length){
      playStatus.textContent = "Only unsupported formats are available for this title right now.";
      return;
    }

    const best = playable[0];
    videoEl.src = best.url;
    qualityPill.textContent = best.resolution;
    playerOverlay.classList.add('open');
    playStatus.textContent = "";

    // Best-effort captions — don't block playback if this fails
    fetch(`${API_BASE}/api/stream/${currentSubject.subjectId}/captions?detail_path=${encodeURIComponent(currentSubject.detailPath)}&se=${se}&ep=${ep}`)
      .then(r => r.json())
      .then(capData => {
        (capData.captions || []).forEach((cap, i) => {
          if(!cap.url) return;
          const track = document.createElement('track');
          track.kind = 'subtitles';
          track.label = cap.lanName || cap.language || `Track ${i+1}`;
          track.srclang = cap.lanCode || cap.language || 'en';
          track.src = cap.url;
          if(i === 0) track.default = true;
          videoEl.appendChild(track);
        });
      })
      .catch(() => {});
  }catch(e){
    playStatus.textContent = "Stream resolution failed. Try again.";
  }
}

/* ---------------- Helpers ---------------- */
function loaderHTML(){
  return `<div class="sprocket-strip" style="padding:60px 0;">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>`;
}
function emptyState(title, sub){
  return `<div class="empty-state"><div class="display">${escapeHtml(title)}</div><div>${escapeHtml(sub)}</div></div>`;
}
function escapeHtml(str){
  if(!str) return "";
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

loadHome();
</script>
</body>
</html>
